services:
  - type: web
    name: apex-radar-bot
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: MIN_LIQUIDATION_USD
        value: 25000
      - key: MEGA_LIQUIDATION_USD
        value: 150000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_FREE_CHANNEL_ID
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_INVITE_LINK
        sync: false
      - key: MONGO_URI
        sync: false
      - key: WHOP_API_KEY
        sync: false
      - key: WHOP_WEBHOOK_SECRET
        sync: false
      - key: MEXC_API_KEY
        sync: false
      - key: MEXC_API_SECRET
        sync: false
      - key: REAL_TRADING_ENABLED
        value: "false"
